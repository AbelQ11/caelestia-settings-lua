name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint-python:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed git python ruff
      - uses: actions/checkout@v4
      - run: ruff check main.py src/ tests/

  test-python:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: >-
          pacman -Syu --noconfirm --needed
          git python python-pytest python-gobject python-cairo python-psutil
          gtk4 libadwaita gobject-introspection libnm
          xorg-server-xvfb dbus
      - uses: actions/checkout@v4
      - run: dbus-run-session -- xvfb-run -a python -m pytest tests -q

  lint-shell:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed git shellcheck
      - uses: actions/checkout@v4
      - run: shellcheck --severity=error install.sh uninstall.sh doctor.sh app_update.sh Update.sh

  lint-rust:
    runs-on: ubuntu-latest
    container: archlinux:latest
    defaults:
      run:
        working-directory: rust
    steps:
      - run: pacman -Syu --noconfirm --needed git rustup
      - run: rustup default stable && rustup component add rustfmt clippy
      - uses: actions/checkout@v4
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test-rust:
    runs-on: ubuntu-latest
    container: archlinux:latest
    needs: lint-rust
    defaults:
      run:
        working-directory: rust
    steps:
      - run: pacman -Syu --noconfirm --needed git rustup
      - run: rustup default stable
      - uses: actions/checkout@v4
      - run: cargo test --workspace

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
